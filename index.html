<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liga žolíků</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#010a13;--panel:#0a1428;--line:#463714;--gold:#c8aa6e;--gold2:#f0e6d2;--text:#cdbe91;--muted:#7b7a6e;--up:#0acbe6;--down:#e84057}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(ellipse at top,#0e2034,var(--bg) 60%) fixed;color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,.cinzel{font-family:Cinzel,serif;color:var(--gold2);letter-spacing:.06em}
header{padding:18px 16px 0;max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.6rem}
select,button,input{font:inherit;background:#1e2328;color:var(--gold2);border:1px solid var(--gold);padding:6px 10px;cursor:pointer}
button:hover{background:#2a3038}
nav{max-width:1100px;margin:12px auto 0;padding:0 16px;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--muted);text-transform:uppercase;font-weight:700;font-size:.8rem;letter-spacing:.08em;padding:10px 12px;white-space:nowrap}
nav button.on{color:var(--gold2);box-shadow:inset 0 -2px var(--gold)}
main{max-width:1100px;margin:auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);padding:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{font-size:.72rem;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px}
td{padding:8px 6px;border-top:1px solid #1e2328}
.num{text-align:right;font-variant-numeric:tabular-nums}
.player{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--gold2);font-weight:600}
.emb{width:34px;height:34px;flex:none}
.rk{font-size:.75rem;color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}
.game{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid #1e2328}
.game b{color:var(--gold2)}
.chip{font-size:.85rem}
.hide-sm{}
@media(max-width:600px){.hide-sm{display:none}td{padding:7px 3px}.emb{width:28px;height:28px}}
.muted{color:var(--muted);font-size:.8rem}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:4px;background:var(--c)}
/* profil */
.ed label{display:block;margin:8px 0}
.ed fieldset{border:1px solid var(--line);margin:14px 0;padding:10px}
.ed legend{color:var(--gold2);font-weight:700;padding:0 6px}
.ed textarea,.ed input:not([type=color]){width:100%;font:inherit;background:#1e2328;color:var(--gold2);border:1px solid var(--gold);padding:6px}
.ed textarea[name=css]{font-family:ui-monospace,monospace}
.ed input[type=color]{width:44px;height:30px;padding:0;vertical-align:middle}
.pe{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid #1e2328}
#bubs,#cbubs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.bub{cursor:pointer}
.bub input{position:absolute;opacity:0}
.bub span,.bub.add{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 6px;border:1px solid var(--line);border-radius:999px;background:#1e2328;color:var(--text);font-weight:600}
.bub .emb{width:26px;height:26px}
.bub input:checked+span{border-color:var(--gold);background:#3a2f12;color:var(--gold2);box-shadow:0 0 10px #c8aa6e66}
.bub input:focus-visible+span{outline:2px solid var(--up)}
.bub.add{padding:4px 14px;border-style:dashed}
#sel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.card{border:1px solid var(--gold);background:#010a13;padding:10px;display:grid;gap:6px;text-align:center}
.card b{color:var(--gold2)}
.card input{width:100%;font-size:1.3rem;text-align:center}
.win{font-size:.8rem}
.hchip{margin:4px;border-color:var(--c);border-radius:999px;color:var(--c)}
.hsearch{display:flex;gap:6px;max-width:420px}
.hsearch input{flex:1;font:inherit;background:#1e2328;color:var(--gold2);border:1px solid var(--gold);padding:8px}
.hres{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.hhit{display:flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px 3px 4px}
.hhit .emb{width:24px;height:24px}
.hgrid{margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hgrid .panel{margin:0}
.hcard{border-top:3px solid var(--c)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tile{background:#010a13;border:1px solid var(--line);padding:14px;display:grid;gap:8px;align-content:start}
.tl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tv{display:flex;justify-content:space-between;align-items:center;gap:8px;border-left:3px solid var(--c);padding-left:8px}
.tv span{color:var(--c);font-size:.85rem}
.tv b{color:var(--gold2);font-size:1.2rem;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tv .emb{width:26px;height:26px}
@media(max-width:600px){
  .tiles{grid-template-columns:1fr}
  nav{flex-wrap:wrap;overflow:visible}
  nav button{padding:8px 9px}
  main{padding:12px}
  .panel{padding:12px}
  h1{font-size:1.3rem}
  input,select,textarea,button{font-size:16px}
  .hgrid{grid-template-columns:1fr}
  #sel{grid-template-columns:repeat(2,1fr)}
  .game{gap:6px 10px}
}
.win:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(1)}
.card.vitez{border-color:var(--up);box-shadow:0 0 12px var(--up)}
.card.vitez .win{border-color:var(--up);color:var(--up)}
.card input:disabled{opacity:.7}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--gold);max-width:520px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:#000a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:#010a13;border:1px solid #1e2328;padding:8px;text-align:center}
.stats b{display:block;color:var(--gold2);font-size:1.15rem}
/* animace */
#fx{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:radial-gradient(circle,#0b1a2cf2,#000f);cursor:pointer;overflow:hidden}
#fx.show{display:grid}
#fx .stage{position:relative;width:260px;height:260px;display:grid;place-items:center}
#fx .stage svg{position:absolute;width:200px;height:200px}
#fx .rays{position:absolute;width:520px;height:520px;border-radius:50%;opacity:0;background:repeating-conic-gradient(var(--rc) 0 6deg,transparent 6deg 20deg);mask:radial-gradient(circle,#000 10%,transparent 65%);-webkit-mask:radial-gradient(circle,#000 10%,transparent 65%)}
#fx .title{font-family:Cinzel,serif;font-weight:800;font-size:2rem;letter-spacing:.15em;text-align:center;opacity:0}
#fx .sub{text-align:center;color:var(--gold2);opacity:0;margin-top:4px}
#fx.upfx .title{color:var(--up);text-shadow:0 0 20px var(--up)}
#fx.downfx .title{color:var(--down);text-shadow:0 0 20px var(--down)}
.old{animation:oldUp 1.2s forwards}
.downfx .old{animation:oldDown 1.4s forwards}
.new{opacity:0;animation:newUp 1s 1.1s forwards}
.downfx .new{animation:newDown 1s 1.4s forwards}
.upfx .rays{animation:rays 3s 1.1s forwards}
.title,.sub{animation:fadeIn .6s 1.8s forwards}
@keyframes oldUp{0%{transform:scale(1)}60%{transform:scale(1.15);filter:brightness(2.5)}100%{transform:scale(1.6);opacity:0;filter:brightness(4) blur(6px)}}
@keyframes oldDown{0%{transform:none}20%,40%{transform:translateX(-4px) rotate(-2deg)}30%,50%{transform:translateX(4px) rotate(2deg)}100%{transform:translateY(120px) rotate(14deg) scale(.7);opacity:0;filter:grayscale(1) brightness(.4)}}
@keyframes newUp{0%{transform:scale(.2) translateY(60px);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes newDown{0%{transform:translateY(-80px);opacity:0;filter:brightness(.3)}100%{transform:none;opacity:1;filter:none}}
@keyframes rays{0%{opacity:0;transform:rotate(0)}20%{opacity:.9}100%{opacity:.35;transform:rotate(60deg)}}
@keyframes fadeIn{to{opacity:1}}
@media(prefers-reduced-motion:reduce){#fx *{animation-duration:.01s!important;animation-delay:0s!important}}

/* ===== Náhled nového vzhledu (jen admin): LoL klient + husté statistiky. Mřížka 4 px, stupnice písma 12/13/14/16/20/28. ===== */
.ic{width:1em;height:1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hdr{display:flex;align-items:center;gap:8px}
html[data-v3]{--bg:#0b0f15;--panel:#11161e;--panel2:#161c26;--line:#262d38;--frame:#5b4a26;--gold:#c8aa6e;--gold2:#f0e6d2;--text:#c4c8d0;--muted:#7f8896;--up:#36b3c7;--down:#e0505f;--in:#0d1219;color-scheme:dark}
html[data-v3][data-theme=light]{--bg:#f2f0eb;--panel:#fff;--panel2:#f8f6f1;--line:#e2ddd2;--frame:#cdb88a;--gold:#8f7134;--gold2:#1d2026;--text:#3a3f48;--muted:#6f7682;--up:#0b7d90;--down:#c22f45;--in:#fff;color-scheme:light}
html[data-v3] body{background:var(--bg);font:14px/1.5 Inter,system-ui,sans-serif;color:var(--text)}
html[data-v3] h1{font:700 20px/1.2 Cinzel,serif;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
html[data-v3] h1 .ic{color:var(--gold);width:22px;height:22px}
html[data-v3] h2{font:600 13px/1.4 Inter,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--gold2);margin:0 0 12px}
html[data-v3] .panel h2:first-child{padding-bottom:8px;border-bottom:1px solid var(--line)}
html[data-v3] .muted,html[data-v3] .rk{font-size:12px;color:var(--muted)}
html[data-v3] header,html[data-v3] nav,html[data-v3] main{max-width:1160px}
html[data-v3] nav{border-color:var(--line);gap:0}
html[data-v3] nav button{border:0;background:none;font-size:12px;letter-spacing:.08em;padding:12px 13px;color:var(--muted)}
html[data-v3] nav button:hover{color:var(--gold2);background:none}
html[data-v3] nav button.on{color:var(--gold2);box-shadow:inset 0 -2px var(--gold)}
html[data-v3] .panel{background:var(--panel);border:1px solid var(--line);border-top-color:var(--frame);padding:16px;margin-bottom:16px;position:relative}
html[data-v3] .panel::before{content:"";position:absolute;top:-1px;left:-1px;width:12px;height:12px;border-top:2px solid var(--gold);border-left:2px solid var(--gold)}
html[data-v3] select,html[data-v3] button,html[data-v3] input{background:var(--panel2);color:var(--gold2);border:1px solid var(--frame);padding:6px 12px;font-size:13px}
html[data-v3] button:hover{background:var(--line)}
html[data-v3] button:disabled{opacity:.4;cursor:not-allowed}
html[data-v3] .hbtn{font-size:12px;padding:4px 8px;display:inline-flex;align-items:center;gap:4px}
html[data-v3] .pri{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
html[data-v3] .pri:hover{background:var(--gold2)}
html[data-v3] th{font-size:12px;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);background:var(--panel2)}
html[data-v3] td{padding:6px 8px;border-top:1px solid var(--line);font-size:13px}
html[data-v3] .lb tr:hover td{background:var(--panel2)}
html[data-v3] .lb td:first-child{color:var(--muted);width:32px;font-variant-numeric:tabular-nums}
html[data-v3] .lb td b{font-size:14px;color:var(--gold2)}
html[data-v3] .player{color:var(--gold2);font-weight:600;font-size:13px}
html[data-v3] .num,html[data-v3] .tv b,html[data-v3] .stats b{font-variant-numeric:tabular-nums}
html[data-v3] .emb{width:32px;height:32px}
html[data-v3] .emb.sm{width:20px;height:20px}
.wr{display:inline-block;width:56px;height:6px;background:var(--down);margin-right:8px;vertical-align:middle}
.wr i{display:block;height:100%;background:var(--up)}
.form{display:inline-flex;gap:2px}
.form i{font-style:normal;width:24px;height:20px;display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.form i.w{background:var(--up);border-color:var(--up);color:var(--bg);font-weight:700}
.peak{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
html[data-v3] .game{border-color:var(--line);gap:4px 16px;padding:8px 0}
html[data-v3] .game button{padding:4px 8px;line-height:1}
html[data-v3] .chip{font-size:13px;font-variant-numeric:tabular-nums}
html[data-v3] .card,html[data-v3] .tile,html[data-v3] .stats div{background:var(--panel2);border-color:var(--line)}
html[data-v3] .card{border-color:var(--frame)}
html[data-v3] .card.vitez{border-color:var(--up);box-shadow:inset 0 0 0 1px var(--up)}
html[data-v3] .card input,html[data-v3] .hsearch input,html[data-v3] .ed textarea,html[data-v3] .ed input:not([type=color]){background:var(--in);color:var(--gold2);border-color:var(--frame)}
html[data-v3] .bub span,html[data-v3] .bub.add{background:var(--panel2);border-color:var(--line);color:var(--text)}
html[data-v3] .bub input:checked+span{background:var(--panel);border-color:var(--gold);color:var(--gold2);box-shadow:inset 0 0 0 1px var(--gold)}
html[data-v3] .tv b{font-size:16px}
html[data-v3] .tl{font-size:12px}
html[data-v3] dialog{background:var(--panel);border-color:var(--frame);color:var(--text)}
html[data-v3] td{border-top-color:var(--line)}
html[data-v3] .chart text{fill:var(--muted)}
/* náhled: turnaj, hodiny, odznaky, konec sezóny */
.note{border-left:2px solid var(--gold);padding:8px 12px;background:var(--panel2,#0000);font-size:13px;margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.cols>.panel{margin:0}
.bracket{display:flex;gap:24px;overflow-x:auto;padding-bottom:8px}
.round{display:flex;flex-direction:column;min-width:200px}
.rm{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.round h3{font:600 12px/1 Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.match{border:1px solid var(--line);background:var(--panel2,var(--panel));cursor:pointer}
.match.on{border-color:var(--gold)}
.match .s{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13px}
.match .s+.s{border-top:1px solid var(--line)}
.match .s span{flex:1;color:var(--gold2)}
.match .s.lose span{color:var(--muted)}
.match .s.win b{color:var(--up)}
.match .s i{font-style:normal;color:var(--muted);font-size:11px;width:16px;font-variant-numeric:tabular-nums}
.match .s b{font-variant-numeric:tabular-nums}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;align-items:end}
.duel label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.duel input{font-size:20px;text-align:center;width:100%}
.clock{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:1fr auto;user-select:none;-webkit-user-select:none}
.cgrid{display:grid;gap:4px;padding:4px}
.cgrid.two{grid-template-rows:1fr 1fr}
.cgrid.two .ct:first-child{transform:rotate(180deg)}
.khint{align-self:center;margin-right:auto}
@media(hover:none){.khint{display:none}}
/* PC: dva hráči vedle sebe bez otočení, víc hráčů v řadě */
@media(min-width:900px) and (hover:hover){.cgrid.two{grid-template-rows:1fr;grid-template-columns:1fr 1fr}.cgrid.two .ct:first-child{transform:none}.ct .t{font-size:clamp(64px,9vw,160px)}.cbar{justify-content:flex-end}}
.cgrid.many{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.ct{border:1px solid var(--line);background:var(--panel);display:grid;place-content:center;text-align:center;gap:4px;cursor:pointer;touch-action:manipulation}
.ct .n{font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ct .t{font:600 clamp(40px,14vw,104px)/1 Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--gold2)}
.ct .pen{font-size:14px;color:var(--down);min-height:20px}
.ct.act{background:var(--panel2,var(--panel));border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.ct.act .n{color:var(--gold)}
.ct.over .t{color:var(--down)}
.cbar{display:flex;gap:8px;justify-content:center;padding:8px;border-top:1px solid var(--line);background:var(--panel)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.badge{display:grid;grid-template-columns:48px 1fr;gap:4px 12px;border:1px solid var(--line);padding:12px;background:var(--panel2,var(--panel))}
.badge svg{grid-row:span 3;width:48px;height:48px}
.badge b{color:var(--gold2);font-size:14px}
.badge small{color:var(--muted);font-size:12px}
.badge .who{font-size:12px}
.badge.none{opacity:.5}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.award{border:1px solid var(--frame,var(--line));padding:12px;display:grid;gap:4px;background:var(--panel2,var(--panel))}
.award .tl{margin:0}
.award b{color:var(--gold2);font-size:16px}
#fx .aw{font-family:Cinzel,serif;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);opacity:0;animation:fadeIn .6s .3s forwards;text-align:center}
#fx.awfx .new{animation:newUp 1s .6s forwards}
#fx.awfx .title{color:var(--gold2);animation-delay:1.2s}
#fx.awfx .sub{animation-delay:1.4s}
#fx.awfx .rays{animation:rays 3s .6s forwards}
@media(max-width:600px){
  html[data-v3] nav button{padding:8px 10px}
  html[data-v3] .panel{padding:12px}
  .cols{grid-template-columns:1fr}
  .wr{display:none}
}
</style>
</head>
<body>
<header>
  <h1>🃏 Liga žolíků</h1>
  <div class="hdr"><span id="ver" class="muted"></span><span id="nahled"></span> <select id="season" aria-label="Sezóna"></select></div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<dialog id="profile"></dialog>
<div id="fx" title="Klikni pro pokračování"></div>

<script src="elo.js?v=3.0"></script>
<script>
// Hry aktuální sezóny se čtou živě z Google tabulky (list Hry); když to nejde, použije se kopie v data.json.
// Adresa webové aplikace z Apps Scriptu (zapis.gs) – přes ni web zapisuje nové hry do tabulky.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUbebqNaNb9ADpLvHq2IEXjaEIKPXFvLiPG-CJBxc0XWBC-wCkmq9HUvablV_XBGY/exec";
// Zápis her je pro kohokoli, proto je heslo pro zápis veřejně tady. Mazání chrání admin heslo, které je jen ve skriptu.
const ZAPIS_HESLO = "zolik-3b1a73";
const SHEET = "https://docs.google.com/spreadsheets/d/1BD5QGv3iKg3nP_JIF1HJng8Mh3q_-CD6O8b0j3PasO8/gviz/tq?tqx=out:csv&sheet=Hry&range=";
const RANK_COLOR = {Iron:"#6e6a66",Bronze:"#a8673f",Silver:"#a9b4c0",Gold:"#d9ae4a",Platinum:"#4fb3a6",Emerald:"#2fc27a",Diamond:"#7690ff",Master:"#b25cf0",Grandmaster:"#e3404d",Challenger:"#f2d27a"};
const LINE = ["#c8aa6e","#0acbe6","#e84057","#2fc27a","#b25cf0","#f08a24","#a9b4c0","#ff7ac6"];
let D, S = {}, cur, tab = "zebricek";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rank = e => rankOf(e, D.ranks);
const tier = r => D.ranks.findIndex(x => x[0] === r);
const fmt = e => Math.round(e);

function look() {
  const on = !admin() || store("zoliky-v3") !== "0", el = document.documentElement;
  if (on !== v3()) { el.toggleAttribute("data-v3", on); applyWeb(); }
  el.dataset.theme = on && store("zoliky-theme") === "light" ? "light" : "dark";
  $("#nahled").innerHTML = (admin() ? ` <button type="button" class="hbtn" id="v3t" aria-pressed="${on}" title="Přepnout starý / nový vzhled">${on ? "Nový vzhled" : "Starý vzhled"}</button>` : "")
    + (on ? ` <button type="button" class="hbtn" id="theme" aria-label="Přepnout světlý / tmavý režim">${ic(el.dataset.theme === "light" ? "moon" : "sun")}</button>` : "");
}
document.addEventListener("click", e => {
  if (e.target.closest("#v3t")) { store("zoliky-v3", v3() ? "0" : "1"); render(); }
  if (e.target.closest("#theme")) { store("zoliky-theme", document.documentElement.dataset.theme === "light" ? "dark" : "light"); render(); }
});
const store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch { return null; } };

function emblem(r, cls = "emb") {
  const c = RANK_COLOR[r], t = tier(r), id = "g" + Math.random().toString(36).slice(2);
  const wings = t >= 4 ? `<path d="M14 40 2 30l4 22 12 8M86 40l12-10-4 22-12 8" fill="${c}" opacity=".7"/>` : "";
  const crown = t >= 7 ? `<path d="M36 12l6 8 8-12 8 12 6-8v10H36z" fill="${c}"/>` : "";
  return `<svg class="${cls}" viewBox="0 0 100 100" role="img" aria-label="${r}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".35" stop-color="${c}"/><stop offset="1" stop-color="#111"/></linearGradient></defs>${wings}${crown}<path d="M50 18 80 30v28c0 16-14 26-30 34C34 84 20 74 20 58V30z" fill="url(#${id})" stroke="${c}" stroke-width="3"/><path d="M50 36l12 16-12 18-12-18z" fill="#010a13" stroke="#fff" stroke-opacity=".6" stroke-width="2"/></svg>`;
}

function stats(season) {
  const { elo, hist } = computeSeason(season, D.settings);
  const st = {};
  season.players.forEach(p => st[p] = { p, elo: elo[p], games: 0, wins: 0, pts: 0, max: D.settings.start, min: D.settings.start });
  hist.forEach(h => Object.entries(h.game).forEach(([p, v]) => {
    const s = st[p]; s.games++; s.pts += v; if (v === 0) s.wins++;
    s.max = Math.max(s.max, h.after[p]); s.min = Math.min(s.min, h.after[p]);
  }));
  const table = Object.values(st).filter(s => s.games).sort((a, b) => b.elo - a.elo);
  return { hist, table, st };
}

// --- načtení dat ---
function csv(t) { return t.trim().split("\n").map(l => [...l.matchAll(/"((?:[^"]|"")*)"/g)].map(m => m[1].replace(/""/g, '"'))); }
async function live() {
  // Jména a čísla zvlášť: gviz zahazuje text ve sloupcích, kde převažují čísla.
  const [h, b] = await Promise.all(["A2:AZ2", "A3:AZ1000"].map(r => fetch(SHEET + r).then(x => { if (!x.ok) throw x; return x.text(); })));
  const head = csv(h)[0].slice(1), players = head.slice(0, head.indexOf("") < 0 ? head.length : head.indexOf(""));
  const games = csv(b).filter(r => /^\d+$/.test(r[0])).map(r => {
    const g = {}; players.forEach((p, i) => { if (r[i + 1] !== undefined && r[i + 1] !== "") g[p] = +r[i + 1]; }); return g;
  }).filter(g => Object.keys(g).length >= 2);
  if (!players.length || !games.length) throw new Error("prázdná data");
  // Časy zápisu (list Casy, řádek = číslo hry); starší hry čas nemají.
  const times = await fetch(SHEET.replace("sheet=Hry", "sheet=Casy") + "A1:A1000").then(x => x.text()).then(t => csv(t).map(r => r[0])).catch(() => []);
  return { players, games, times: times.every(t => !t || /^\d{4}-\d\d-\d\dT/.test(t)) ? times : [] };
}

// Verze webu: při vydání patche změň VERSION i version.json. Když prohlížeč drží starou verzi
// (GitHub Pages ji cachuje ~10 min), stáhne novou a stránku jednou obnoví.
const VERSION = "3.0";
async function ensureFresh() {
  try {
    const { v } = await fetch("version.json", { cache: "no-store" }).then(r => r.json());
    if (v === VERSION || sessionStorage.getItem("zoliky-reload") === v) return;
    sessionStorage.setItem("zoliky-reload", v);
    await Promise.all([location.pathname, "elo.js", "nahled.js", "data.json"].map(u => fetch(u, { cache: "reload" })));
    location.reload();
    await new Promise(() => {}); // stránka se obnovuje
  } catch {}
}

async function init() {
  await ensureFresh();
  $("#ver").textContent = "patch " + VERSION;
  D = await fetch("data.json", { cache: "no-cache" }).then(r => r.json());
  let src = "uložená kopie";
  try { Object.assign(D.seasons[0], await live()); src = "živě z Google tabulky"; } catch (e) { console.warn("Tabulka nedostupná, beru data.json", e); }
  D.src = src;
  try { Object.assign(WEB, JSON.parse(csv(await fetch(SHEET.replace("sheet=Hry", "sheet=Web") + "A1").then(r => r.text()))[0][0])); } catch (e) { console.warn("Nastavení webu nenalezeno, beru výchozí", e); }
  applyWeb();
  D.seasons.forEach(s => S[s.id] = stats(s));
  $("#season").innerHTML = D.seasons.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  $("#season").onchange = e => { cur = D.seasons.find(s => s.id === e.target.value); render(); };
  cur = D.seasons[0];
  render();
  autoPlay();
}

// Nový vzhled: hustší žebříček jako op.gg (winrate pruh, trend, forma, peak).
const wrbar = s => { const w = Math.round(100 * s.wins / s.games); return `<span class="wr"><i style="width:${w}%"></i></span>${w}%`; };
function extra(s) {
  const mine = S[cur.id].hist.filter(h => s.p in h.game).slice(-5), d = mine.length ? fmt(mine.at(-1).after[s.p]) - fmt(mine[0].before[s.p]) : 0;
  return `<td class="num hide-sm ${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : ""}${d}</td>
    <td class="hide-sm"><span class="form" title="nejnovější hra vlevo">${mine.slice().reverse().map(h => h.game[s.p] === 0 ? `<i class="w" title="výhra">V</i>` : `<i title="${h.game[s.p]} bodů">${h.game[s.p]}</i>`).join("")}</span></td>
    <td class="hide-sm"><span class="peak">${emblem(rank(s.max), "emb sm")}${fmt(s.max)}</span></td>`;
}
function chart(hist, players, w = 900, h = 320) {
  // Na mobilu užší plátno, ať popisky nejsou mikroskopické.
  if (innerWidth < 600) { h = Math.round(h * .9); w = 420; }
  const vals = hist.flatMap(x => players.map(p => x.after[p])).concat(D.settings.start);
  const lo = Math.min(...vals) - 5, hi = Math.max(...vals) + 5, n = hist.length;
  const X = i => 30 + (w - 40) * i / n, Y = v => 10 + (h - 30) * (hi - v) / (hi - lo);
  const grid = D.ranks.filter(([, f]) => f > lo && f < hi).map(([r, f]) => `<line x1="30" x2="${w - 10}" y1="${Y(f)}" y2="${Y(f)}" stroke="${RANK_COLOR[r]}" stroke-dasharray="4 4" opacity=".5"/><text x="${w - 12}" y="${Y(f) - 3}" fill="${RANK_COLOR[r]}" font-size="11" text-anchor="end">${r}</text>`).join("");
  const lines = players.map((p, j) => {
    // hráč má bod jen po hrách, které hrál (a start)
    const pts = [[0, D.settings.start]]; hist.forEach((x, i) => { if (p in x.game) pts.push([i + 1, x.after[p]]); });
    return `<polyline fill="none" stroke="${LINE[j % LINE.length]}" stroke-width="2" points="${pts.map(([i, v]) => X(i) + "," + Y(v)).join(" ")}"/>`;
  }).join("");
  const id = "c" + Math.random().toString(36).slice(2);
  // Čáry se odkrývají zleva doprava, jak šly hry po sobě; kliknutí na graf to přehraje znovu.
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;cursor:pointer" data-replay="${id}" role="img" aria-label="Vývoj Elo, klikni pro přehrání"><defs><clipPath id="${id}"><rect x="0" y="0" height="${h}" width="0"><animate attributeName="width" from="30" to="${w}" dur="${Math.min(6, 1 + n / 20)}s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1" keyTimes="0;1"/></rect></clipPath></defs>
    ${grid}<g clip-path="url(#${id})">${lines}</g><text x="30" y="${h - 4}" fill="#7b7a6e" font-size="11">hra 0</text><text x="${w - 10}" y="${h - 4}" fill="#7b7a6e" font-size="11" text-anchor="end">hra ${n}</text></svg></div>
    <div class="legend">${players.map((p, j) => `<span style="--c:${LINE[j % LINE.length]}" data-p="${esc(p)}">${esc(p)}</span>`).join("")}</div>`;
}

// --- 🧪 Hráči (náhled): statistiky jednoho hráče, připravené na porovnání více hráčů ---
let cmp = [];
function pstats(p) {
  const { st, hist, table } = S[cur.id], s = st[p], mine = hist.filter(h => p in h.game);
  const deltas = mine.map(h => h.after[p] - h.before[p]), pts = mine.map(h => h.game[p]);
  let streak = 0, best = 0;
  pts.forEach(v => { streak = v === 0 ? streak + 1 : 0; best = Math.max(best, streak); });
  const opp = {};
  mine.forEach(h => Object.keys(h.game).forEach(o => { if (o !== p) opp[o] = (opp[o] || 0) + 1; }));
  const rival = Object.entries(opp).sort((a, b) => b[1] - a[1])[0];
  const sign = d => (d >= 0 ? "+" : "") + Math.round(d);
  const nonWin = pts.filter(v => v > 0);
  return {
    p, elo: s.elo, rank: rank(s.elo), games: s.games, wins: s.wins, pts: s.pts,
    winrate: s.games ? Math.round(100 * s.wins / s.games) : 0,
    avg: s.games ? (s.pts / s.games).toFixed(1).replace(".", ",") : "—",
    pos: table.findIndex(x => x.p === p) + 1,
    max: s.max, min: s.min, peakRank: rank(s.max), bottomRank: rank(s.min),
    bestStreak: best,
    form: pts.slice(-5).map(v => v === 0 ? ic("trophy") : v).join(" · ") || "—",
    bestGain: deltas.length ? sign(Math.max(...deltas)) : "—",
    worstLoss: deltas.length ? sign(Math.min(...deltas)) : "—",
    avgDelta: deltas.length ? (d => (d >= 0 ? "+" : "") + d.toFixed(1).replace(".", ","))(deltas.reduce((a, b) => a + b, 0) / deltas.length) : "—",
    bestNonWin: nonWin.length ? Math.min(...nonWin) : "—",
    worstGame: pts.length ? Math.max(...pts) : "—",
    rival: rival ? `${esc(rival[0])} (${rival[1]}×)` : "—"
  };
}
// Hledání bez ohledu na velikost písmen a diakritiku; výsledky se ukazují už při psaní.
const norm = t => t.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
const hmatch = q => S[cur.id].table.map(x => x.p).filter(p => !cmp.includes(p) && norm(p).includes(norm(q.trim())));
const hres = q => hmatch(q).map(p => `<button type="button" class="hhit" data-hadd="${esc(p)}">${emblem(rank(S[cur.id].st[p].elo))}${esc(p)}</button>`).join("") || `<span class="muted">Nikdo takový</span>`;
function hadd(p) { cmp.push(p); render(); }
document.addEventListener("input", e => { if (e.target.id === "hsearch") $("#hres").innerHTML = hres(e.target.value); });
document.addEventListener("submit", e => { if (e.target.id !== "hf") return; e.preventDefault(); const m = hmatch($("#hsearch").value); if (m.length) hadd(m[0]); });
document.addEventListener("click", e => { const b = e.target.closest("[data-hadd]"); if (b) hadd(b.dataset.hadd); });
document.addEventListener("click", e => { const b = e.target.closest("[data-hdel]"); if (b) { cmp = cmp.filter(p => p !== b.dataset.hdel); render(); } });

function openProfile(p) {
  const s = S[cur.id].st[p], r = rank(s.elo), dlg = $("#profile");
  dlg.innerHTML = `<div class="player" style="cursor:auto">${emblem(r, "emb\" style=\"width:72px;height:72px")}<div><h2 style="margin:0">${esc(p)}</h2>${cur.fullNames?.[p] ? `<div class="muted">${esc(cur.fullNames[p])}</div>` : ""}<div class="rk">${r} · ${fmt(s.elo)} Elo</div></div></div>
    <div class="stats"><div><b>${s.games}</b>her</div><div><b>${s.wins}</b>výher</div><div><b>${s.games ? Math.round(100 * s.wins / s.games) : 0}%</b>winrate</div>
    <div><b>${s.games ? (s.pts / s.games).toFixed(1).replace(".", ",") : "—"}</b>Ø body</div><div><b>${fmt(s.max)}</b>max Elo</div><div><b>${fmt(s.min)}</b>min Elo</div></div>
    ${chart(S[cur.id].hist, [p], 500, 200)}<form method="dialog" style="text-align:right;margin-top:10px"><button>Zavřít</button></form>`;
  dlg.showModal();
}

document.addEventListener("submit", async e => {
  if (e.target.id !== "zf") return;
  e.preventDefault();
  const f = e.target, msg = $("#zmsg"), hra = {};
  const inputs = [...f.querySelectorAll("#sel input")];
  if (inputs.some(i => i.value === "")) return msg.textContent = "Doplň body všem vybraným hráčům.";
  inputs.forEach(i => hra[i.name] = +i.value);
  const nove = Object.keys(hra).filter(p => !D.seasons[0].players.includes(p)), novy = nove[0];
  if (nove.length > 1) return msg.textContent = "V jedné hře může být nejvýš 1 nový hráč.";
  const v = Object.values(hra);
  if (v.length < 2 || v.length > 6) return msg.textContent = "Vyber 2–6 hráčů.";
  if (v.some(x => !Number.isInteger(x) || x < 0 || x > 999)) return msg.textContent = "Body musí být celá čísla 0–999.";
  if (!v.includes(0)) return msg.textContent = "Někdo musí zavřít (0 bodů).";
  msg.textContent = "Ukládám…";
  try {
    const r = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ heslo: ZAPIS_HESLO, hra }) }).then(x => x.json());
    if (!r.ok) return msg.textContent = r.chyba || "Uložení selhalo.";
    // když tabulka ještě nestihla, přidej hru lokálně
    await reload(s => { s.games.push(hra); (s.times ||= [])[s.games.length - 1] = new Date().toISOString(); if (novy) s.players.push(novy); });
    autoPlay();
  } catch (err) { msg.textContent = "Nepodařilo se spojit s tabulkou: " + err.message; }
});

// --- zápis: bubliny hráčů ---
const bubble = p => `<label class="bub"><input type="checkbox" value="${esc(p)}"><span>${emblem(rank(S[D.seasons[0].id].st[p]?.elo ?? D.settings.start))}${esc(p)}</span></label>`;
let winner = null;
function cards() {
  const vals = {}, picked = [...$("#bubs").querySelectorAll("input:checked")].map(c => c.value);
  $("#sel").querySelectorAll("input").forEach(i => vals[i.name] = i.value);
  if (!picked.includes(winner)) winner = null;
  $("#sel").innerHTML = picked.map(p => { const w = p === winner; return `<div class="card${w ? " vitez" : ""}"><b>${esc(p)}</b>
    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" name="${esc(p)}" value="${w ? 0 : esc(vals[p] ?? "")}" placeholder="body" aria-label="Body ${esc(p)}" ${w ? "disabled" : ""}>
    <button type="button" class="win" data-win="${esc(p)}" ${winner && !w ? "disabled" : ""} aria-pressed="${w}">${ic("trophy")} ${w ? "vítěz ✓" : "vítěz"}</button></div>`; }).join("");
}
// do políček s body jdou napsat jen číslice
document.addEventListener("input", e => {
  if (!e.target.closest("#sel")) return;
  e.target.value = e.target.value.replace(/\D/g, "");
  if (e.target.value === "0" && !winner) { winner = e.target.name; cards(); }
});
document.addEventListener("change", e => { if (e.target.closest("#bubs")) cards(); });
document.addEventListener("click", e => { if (e.target.id === "tocur") { cur = D.seasons[0]; $("#season").value = cur.id; render(); } });
document.addEventListener("click", e => {
  if (e.target.id === "novy") {
    const p = (prompt("Jméno nového hráče:") || "").trim();
    if (!p) return;
    if (![...$("#bubs").querySelectorAll("input")].some(i => i.value === p)) e.target.insertAdjacentHTML("beforebegin", bubble(p));
    [...$("#bubs").querySelectorAll("input")].find(i => i.value === p).checked = true;
    cards();
  }
  const w = e.target.closest("[data-win]");
  if (w) { const p = w.dataset.win; if (winner === p) $("#sel").querySelector(`input[name="${CSS.escape(p)}"]`).value = ""; winner = winner === p ? null : p; cards(); }
});

const WEB = structuredClone(DEFAULT_WEB);
function txt(t) {
  return t.split("\n").map(l => l.startsWith("- ") ? `<li>${esc(l.slice(2))}</li>` : l.trim() ? `<p>${esc(l)}</p>` : "").join("")
    .replace(/(<li>.*?<\/li>)+/g, m => `<ul>${m}</ul>`);
}
function applyWeb() {
  // Nový vzhled má vlastní paletu (tmavou i světlou), barvy z editoru platí jen pro starý.
  for (const [k, v] of Object.entries(WEB.barvy)) v3() ? document.documentElement.style.removeProperty("--" + k) : document.documentElement.style.setProperty("--" + k, v);
  $("h1").innerHTML = (v3() ? ic("card") : "🃏") + " " + esc(WEB.nazev);
  document.title = WEB.nazev;
  ($("#customcss") || document.head.appendChild(Object.assign(document.createElement("style"), { id: "customcss" }))).textContent = WEB.css;
}
document.addEventListener("input", e => {
  const t = e.target;
  if (!t.closest("#ef")) return;
  if (t.name === "nazev") WEB.nazev = t.value;
  else if (t.name === "css") WEB.css = t.value;
  else if (t.dataset.barva) WEB.barvy[t.dataset.barva] = t.value;
  else if (t.dataset.pn) WEB.patche[t.dataset.pn].nadpis = t.value;
  else if (t.dataset.pt) WEB.patche[t.dataset.pt].text = t.value;
  applyWeb();
});
document.addEventListener("click", e => {
  const t = e.target;
  if (!t.closest("#ef")) return;
  if (t.id === "padd") WEB.patche.unshift({ nadpis: "Patch ? · " + new Date().toLocaleDateString("cs-CZ"), text: "- " });
  else if (t.dataset.pdel) { if (!confirm("Smazat tento patch?")) return; WEB.patche.splice(+t.dataset.pdel, 1); }
  else if (t.dataset.pmove) { const i = +t.dataset.pmove; [WEB.patche[i - 1], WEB.patche[i]] = [WEB.patche[i], WEB.patche[i - 1]]; }
  else if (t.id === "ereset") { if (!confirm("Vrátit výchozí vzhled a texty? (Uloží se až tlačítkem Uložit.)")) return; Object.assign(WEB, structuredClone(DEFAULT_WEB)); applyWeb(); }
  else return;
  render();
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "ef") return;
  e.preventDefault();
  $("#emsg").textContent = "Ukládám…";
  try {
    const r = await post({ akce: "web", heslo: admin(), web: WEB });
    $("#emsg").textContent = r.ok ? "Uloženo ✓" : (r.chyba || "Uložení selhalo.");
  } catch (err) { $("#emsg").textContent = "Nepodařilo se spojit s tabulkou: " + err.message; }
});

// --- admin: mazání her ---
const admin = () => store("zoliky-admin");
const post = body => fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(body) }).then(x => x.json());
async function reload(fallback) {
  const s = D.seasons[0];
  try { Object.assign(s, await live()); } catch { fallback(s); }
  S[s.id] = stats(s);
  cur = s; $("#season").value = s.id; tab = "hry"; render();
}
document.addEventListener("submit", async e => {
  if (e.target.id !== "af") return;
  e.preventDefault();
  $("#amsg").textContent = "Ověřuji…";
  const heslo = $("#aheslo").value;
  try {
    const r = await post({ akce: "overit", heslo });
    if (!r.admin) return $("#amsg").textContent = "Tohle není admin heslo.";
    store("zoliky-admin", heslo); render();
  } catch (err) { $("#amsg").textContent = "Nepodařilo se spojit s tabulkou: " + err.message; }
});
document.addEventListener("click", async e => {
  if (e.target.id === "odhlasit") { try { localStorage.removeItem("zoliky-admin"); } catch {} return render(); }
  const b = e.target.closest("[data-del]");
  if (!b) return;
  const i = +b.dataset.del;
  if (!confirm(`Opravdu smazat hru #${i + 1}? Další hry se posunou o jedno číslo dolů.`)) return;
  b.disabled = true;
  try {
    const r = await post({ akce: "smazat", heslo: admin(), cislo: i + 1 });
    if (!r.ok) { alert(r.chyba || "Smazání selhalo."); b.disabled = false; return; }
    await reload(s => s.games.splice(i, 1));
  } catch (err) { alert("Nepodařilo se spojit s tabulkou: " + err.message); b.disabled = false; }
});

// --- rank up / rank down animace ---
let queue = [], playing = false;
function rankChanges(h) { return Object.keys(h.game).filter(p => rank(h.before[p]) !== rank(h.after[p])).map(p => ({ p, from: rank(h.before[p]), to: rank(h.after[p]), elo: h.after[p] })); }
function playGame(i) { queue.push(...rankChanges(S[cur.id].hist[i])); next(); }
function next() {
  if (playing || !queue.length) return;
  playing = true;
  const c = queue.shift(), up = tier(c.to) > tier(c.from), fx = $("#fx");
  fx.className = "show " + (up ? "upfx" : "downfx");
  fx.style.setProperty("--rc", RANK_COLOR[c.to] + "88");
  fx.innerHTML = `<div><div class="stage"><div class="rays"></div>${emblem(c.from, "old")}${emblem(c.to, "new")}</div>
    <div class="title">${up ? "Povýšení" : "Sestup"}</div><div class="sub">${esc(c.p)} · ${c.from} → ${c.to} · ${fmt(c.elo)} Elo</div></div>`;
  const done = () => { fx.onclick = null; clearTimeout(t); fx.className = ""; playing = false; next(); };
  const t = setTimeout(done, 5000);
  fx.onclick = done;
}
// Při otevření přehraje změny ranků z her, které tenhle prohlížeč ještě neviděl.
function autoPlay() {
  const s = D.seasons[0], hist = S[s.id].hist, key = "zoliky-seen-" + s.id;
  const seen = store(key);
  const from = seen === null ? hist.length - 1 : +seen;
  hist.slice(Math.max(0, from)).forEach(h => queue.push(...rankChanges(h)));
  store(key, hist.length);
  next();
}

init();
