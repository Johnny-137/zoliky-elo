<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liga žolíků</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#010a13;--panel:#0a1428;--line:#463714;--gold:#c8aa6e;--gold2:#f0e6d2;--text:#cdbe91;--muted:#7b7a6e;--up:#0acbe6;--down:#e84057}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#0e2034,var(--bg) 60%) fixed;color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,.cinzel{font-family:Cinzel,serif;color:var(--gold2);letter-spacing:.06em}
header{padding:18px 16px 0;max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.6rem}
select,button,input{font:inherit;background:#1e2328;color:var(--gold2);border:1px solid var(--gold);padding:6px 10px;cursor:pointer}
button:hover{background:#2a3038}
nav{max-width:1100px;margin:12px auto 0;padding:0 16px;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--muted);text-transform:uppercase;font-weight:700;font-size:.8rem;letter-spacing:.08em;padding:10px 12px;white-space:nowrap}
nav button.on{color:var(--gold2);box-shadow:inset 0 -2px var(--gold)}
main{max-width:1100px;margin:auto;padding:16px}
.panel{background:linear-gradient(#0a1428ee,#091220ee);border:1px solid var(--line);padding:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{font-size:.72rem;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px}
td{padding:8px 6px;border-top:1px solid #1e2328}
.num{text-align:right;font-variant-numeric:tabular-nums}
.player{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--gold2);font-weight:600}
.emb{width:34px;height:34px;flex:none}
.rk{font-size:.75rem;color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}
.game{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid #1e2328}
.game b{color:var(--gold2)}
.chip{font-size:.85rem}
.hide-sm{}
@media(max-width:600px){.hide-sm{display:none}td{padding:7px 3px}.emb{width:28px;height:28px}}
.muted{color:var(--muted);font-size:.8rem}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:4px;background:var(--c)}
/* profil */
#bubs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.bub{cursor:pointer}
.bub input{position:absolute;opacity:0}
.bub span,.bub.add{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 6px;border:1px solid var(--line);border-radius:999px;background:#1e2328;color:var(--text);font-weight:600}
.bub .emb{width:26px;height:26px}
.bub input:checked+span{border-color:var(--gold);background:#3a2f12;color:var(--gold2);box-shadow:0 0 10px #c8aa6e66}
.bub input:focus-visible+span{outline:2px solid var(--up)}
.bub.add{padding:4px 14px;border-style:dashed}
#sel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.card{border:1px solid var(--gold);background:#010a13;padding:10px;display:grid;gap:6px;text-align:center}
.card b{color:var(--gold2)}
.card input{width:100%;font-size:1.3rem;text-align:center}
.win{font-size:.8rem}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--gold);max-width:520px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:#000a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:#010a13;border:1px solid #1e2328;padding:8px;text-align:center}
.stats b{display:block;color:var(--gold2);font-size:1.15rem}
/* animace */
#fx{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:radial-gradient(circle,#0b1a2cf2,#000f);cursor:pointer;overflow:hidden}
#fx.show{display:grid}
#fx .stage{position:relative;width:260px;height:260px;display:grid;place-items:center}
#fx .stage svg{position:absolute;width:200px;height:200px}
#fx .rays{position:absolute;width:520px;height:520px;border-radius:50%;opacity:0;background:repeating-conic-gradient(var(--rc) 0 6deg,transparent 6deg 20deg);mask:radial-gradient(circle,#000 10%,transparent 65%);-webkit-mask:radial-gradient(circle,#000 10%,transparent 65%)}
#fx .title{font-family:Cinzel,serif;font-weight:800;font-size:2rem;letter-spacing:.15em;text-align:center;opacity:0}
#fx .sub{text-align:center;color:var(--gold2);opacity:0;margin-top:4px}
#fx.upfx .title{color:var(--up);text-shadow:0 0 20px var(--up)}
#fx.downfx .title{color:var(--down);text-shadow:0 0 20px var(--down)}
.old{animation:oldUp 1.2s forwards}
.downfx .old{animation:oldDown 1.4s forwards}
.new{opacity:0;animation:newUp 1s 1.1s forwards}
.downfx .new{animation:newDown 1s 1.4s forwards}
.upfx .rays{animation:rays 3s 1.1s forwards}
.title,.sub{animation:fadeIn .6s 1.8s forwards}
@keyframes oldUp{0%{transform:scale(1)}60%{transform:scale(1.15);filter:brightness(2.5)}100%{transform:scale(1.6);opacity:0;filter:brightness(4) blur(6px)}}
@keyframes oldDown{0%{transform:none}20%,40%{transform:translateX(-4px) rotate(-2deg)}30%,50%{transform:translateX(4px) rotate(2deg)}100%{transform:translateY(120px) rotate(14deg) scale(.7);opacity:0;filter:grayscale(1) brightness(.4)}}
@keyframes newUp{0%{transform:scale(.2) translateY(60px);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes newDown{0%{transform:translateY(-80px);opacity:0;filter:brightness(.3)}100%{transform:none;opacity:1;filter:none}}
@keyframes rays{0%{opacity:0;transform:rotate(0)}20%{opacity:.9}100%{opacity:.35;transform:rotate(60deg)}}
@keyframes fadeIn{to{opacity:1}}
@media(prefers-reduced-motion:reduce){#fx *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<header>
  <h1>🃏 Liga žolíků</h1>
  <select id="season" aria-label="Sezóna"></select>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<dialog id="profile"></dialog>
<div id="fx" title="Klikni pro pokračování"></div>

<script src="elo.js"></script>
<script>
// Hry aktuální sezóny se čtou živě z Google tabulky (list Hry); když to nejde, použije se kopie v data.json.
// Adresa webové aplikace z Apps Scriptu (zapis.gs) – přes ni web zapisuje nové hry do tabulky.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUbebqNaNb9ADpLvHq2IEXjaEIKPXFvLiPG-CJBxc0XWBC-wCkmq9HUvablV_XBGY/exec";
// Zápis her je pro kohokoli, proto je heslo pro zápis veřejně tady. Mazání chrání admin heslo, které je jen ve skriptu.
const ZAPIS_HESLO = "zolik-3b1a73";
const SHEET = "https://docs.google.com/spreadsheets/d/1BD5QGv3iKg3nP_JIF1HJng8Mh3q_-CD6O8b0j3PasO8/gviz/tq?tqx=out:csv&sheet=Hry&range=";
const RANK_COLOR = {Iron:"#6e6a66",Bronze:"#a8673f",Silver:"#a9b4c0",Gold:"#d9ae4a",Platinum:"#4fb3a6",Emerald:"#2fc27a",Diamond:"#7690ff",Master:"#b25cf0",Grandmaster:"#e3404d",Challenger:"#f2d27a"};
const LINE = ["#c8aa6e","#0acbe6","#e84057","#2fc27a","#b25cf0","#f08a24","#a9b4c0","#ff7ac6"];
let D, S = {}, cur, tab = "zebricek";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rank = e => rankOf(e, D.ranks);
const tier = r => D.ranks.findIndex(x => x[0] === r);
const fmt = e => Math.round(e);
const store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch { return null; } };

function emblem(r, cls = "emb") {
  const c = RANK_COLOR[r], t = tier(r), id = "g" + Math.random().toString(36).slice(2);
  const wings = t >= 4 ? `<path d="M14 40 2 30l4 22 12 8M86 40l12-10-4 22-12 8" fill="${c}" opacity=".7"/>` : "";
  const crown = t >= 7 ? `<path d="M36 12l6 8 8-12 8 12 6-8v10H36z" fill="${c}"/>` : "";
  return `<svg class="${cls}" viewBox="0 0 100 100" role="img" aria-label="${r}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".35" stop-color="${c}"/><stop offset="1" stop-color="#111"/></linearGradient></defs>${wings}${crown}<path d="M50 18 80 30v28c0 16-14 26-30 34C34 84 20 74 20 58V30z" fill="url(#${id})" stroke="${c}" stroke-width="3"/><path d="M50 36l12 16-12 18-12-18z" fill="#010a13" stroke="#fff" stroke-opacity=".6" stroke-width="2"/></svg>`;
}

function stats(season) {
  const { elo, hist } = computeSeason(season, D.settings);
  const st = {};
  season.players.forEach(p => st[p] = { p, elo: elo[p], games: 0, wins: 0, pts: 0, max: D.settings.start, min: D.settings.start });
  hist.forEach(h => Object.entries(h.game).forEach(([p, v]) => {
    const s = st[p]; s.games++; s.pts += v; if (v === 0) s.wins++;
    s.max = Math.max(s.max, h.after[p]); s.min = Math.min(s.min, h.after[p]);
  }));
  const table = Object.values(st).filter(s => s.games).sort((a, b) => b.elo - a.elo);
  return { hist, table, st };
}

// --- načtení dat ---
function csv(t) { return t.trim().split("\n").map(l => [...l.matchAll(/"((?:[^"]|"")*)"/g)].map(m => m[1].replace(/""/g, '"'))); }
async function live() {
  // Jména a čísla zvlášť: gviz zahazuje text ve sloupcích, kde převažují čísla.
  const [h, b] = await Promise.all(["A2:AZ2", "A3:AZ1000"].map(r => fetch(SHEET + r).then(x => { if (!x.ok) throw x; return x.text(); })));
  const head = csv(h)[0].slice(1), players = head.slice(0, head.indexOf("") < 0 ? head.length : head.indexOf(""));
  const games = csv(b).filter(r => /^\d+$/.test(r[0])).map(r => {
    const g = {}; players.forEach((p, i) => { if (r[i + 1] !== undefined && r[i + 1] !== "") g[p] = +r[i + 1]; }); return g;
  }).filter(g => Object.keys(g).length >= 2);
  if (!players.length || !games.length) throw new Error("prázdná data");
  return { players, games };
}

async function init() {
  D = await fetch("data.json").then(r => r.json());
  let src = "uložená kopie";
  try { Object.assign(D.seasons[0], await live()); src = "živě z Google tabulky"; } catch (e) { console.warn("Tabulka nedostupná, beru data.json", e); }
  D.src = src;
  D.seasons.forEach(s => S[s.id] = stats(s));
  $("#season").innerHTML = D.seasons.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  $("#season").onchange = e => { cur = D.seasons.find(s => s.id === e.target.value); render(); };
  cur = D.seasons[0];
  render();
  autoPlay();
}

// --- pohledy ---
const TABS = { zebricek: "Žebříček", hry: "Hry", zapis: "Zápis hry", vyvoj: "Vývoj Elo", patch: "Patch notes", pravidla: "Pravidla" };
function render() {
  $("#tabs").innerHTML = Object.entries(TABS).map(([k, v]) => `<button class="${k === tab ? "on" : ""}" data-t="${k}">${v}</button>`).join("");
  $("#tabs").onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; render(); } };
  $("#view").innerHTML = VIEWS[tab]();
}
const name = p => `<span class="player" data-p="${esc(p)}">${esc(p)}</span>`;
document.addEventListener("click", e => { const p = e.target.closest("[data-p]"); if (p) openProfile(p.dataset.p); const g = e.target.closest("[data-play]"); if (g) playGame(+g.dataset.play); });

const VIEWS = {
  zebricek() {
    const { table, hist } = S[cur.id];
    const rows = table.map((s, i) => { const r = rank(s.elo); return `<tr>
      <td>${i + 1}</td><td><div class="player" data-p="${esc(s.p)}">${emblem(r)}<div>${esc(s.p)}<div class="rk">${r}</div></div></div></td>
      <td class="num"><b>${fmt(s.elo)}</b></td><td class="num">${s.games}</td><td class="num hide-sm">${s.wins}</td>
      <td class="num">${Math.round(100 * s.wins / s.games)}%</td><td class="num hide-sm">${(s.pts / s.games).toFixed(1).replace(".", ",")}</td></tr>`; }).join("");
    return `<div class="panel"><h2>${esc(cur.name)}</h2><p class="muted">${hist.length} her · ${table.length} hráčů${cur.id === D.seasons[0].id ? " · data: " + D.src : " · archiv, do aktuálního Elo se nepočítá"}</p>
      <table><tr><th>#</th><th>Hráč</th><th class="num">Elo</th><th class="num">Hry</th><th class="num hide-sm">Výhry</th><th class="num">Win%</th><th class="num hide-sm">Ø body</th></tr>${rows}</table></div>
`;
  },
  hry() {
    const { hist } = S[cur.id];
    return `<div class="panel"><h2>Hry</h2><p class="muted">0 = zavřel. U her se změnou ranku můžeš animaci přehrát ▶.</p>${hist.map((h, i) => {
      const ps = Object.entries(h.game).sort((a, b) => a[1] - b[1]);
      const changed = ps.some(([p]) => rank(h.before[p]) !== rank(h.after[p]));
      return `<div class="game"><b>#${i + 1}</b>${ps.map(([p, v]) => { const d = fmt(h.after[p]) - fmt(h.before[p]);
        const rc = rank(h.after[p]) !== rank(h.before[p]) ? (tier(rank(h.after[p])) > tier(rank(h.before[p])) ? " ⬆" : " ⬇") : "";
        return `<span class="chip">${name(p)} ${v === 0 ? "🏆" : v} <span class="${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : ""}${d}${rc}</span></span>`; }).join("")}
        ${changed ? `<button data-play="${i}" aria-label="Přehrát animaci">▶</button>` : ""}
        ${admin() && cur === D.seasons[0] ? `<button data-del="${i}" aria-label="Smazat hru">🗑</button>` : ""}</div>`; }).reverse().join("")}</div>`;
  },
  vyvoj() {
    const { hist, table } = S[cur.id];
    return `<div class="panel"><h2>Vývoj Elo</h2>${chart(hist, table.map(s => s.p))}</div>`;
  },
  zapis() {
    const s = D.seasons[0];
    if (!SCRIPT_URL) return `<div class="panel"><h2>Zápis hry</h2><p>Zápis ještě není propojený s tabulkou (chybí adresa Apps Scriptu).</p></div>`;
    const known = S[s.id].table.map(x => x.p).concat(s.players.filter(p => !S[s.id].st[p].games));
    return `<div class="panel"><h2>Zápis hry · ${esc(s.name)} #${S[s.id].hist.length + 1}</h2>
      <p class="muted">1. Klikni na hráče, kteří hráli. 2. Pod každého napiš trestné body (kdo zavřel, má 0).</p>
      <form id="zf"><div id="bubs">${known.map(bubble).join("")}<button type="button" id="novy" class="bub add">+ Nový hráč</button></div>
      <div id="sel"></div>
      <p><button>Uložit hru</button></p>
      <p id="zmsg" class="muted" role="status"></p></form></div>
      <div class="panel"><h2>Admin</h2>${admin()
        ? `<p>Jsi přihlášený jako admin – v záložce Hry můžeš hry mazat 🗑.</p><button id="odhlasit">Odhlásit</button>`
        : `<form id="af"><input type="password" id="aheslo" placeholder="Admin heslo"> <button>Přihlásit</button> <span id="amsg" class="muted" role="status"></span></form>`}</div>`;
  },
  patch() {
    return `<div class="panel"><h2>Patch 1.2.1 · 7. 10. 2026</h2><p>Nový zápis hry.</p><ul>
      <li>Hráče vybereš kliknutím na bubliny s jejich rank emblémem.</li>
      <li>Pod každým vybraným hráčem je karta s políčkem na body, tlačítko 🏆 zavřel zapíše 0.</li>
      <li>Nového hráče přidáš bublinou „+ Nový hráč“.</li></ul></div>
      <div class="panel"><h2>Patch 1.2 · 7. 10. 2026</h2><p>Liga žolíků má vlastní web.</p><ul>
      <li>Žebříček s rank emblémy, historie her, graf vývoje Elo a profily hráčů.</li>
      <li>Rank up a rank down animace jako v League of Legends – přehrají se po nové hře i na kliknutí ▶ u hry.</li>
      <li>Hry zapisuje kdokoli přímo na webu, výsledky se ukládají do tabulky.</li>
      <li>Admin může s heslem smazat špatně zapsanou hru.</li>
      <li>Minulá sezóna je na webu taky, stačí ji vybrat nahoře.</li></ul></div>
      <div class="panel"><h2>Patch 1.1 · 29. 9. 2026</h2><p>Elo se nově počítá hlavně podle toho, s kolika body kdo skončí – ne jen podle toho, kdo zavřel.</p><ul>
      <li>Body rozhodují z 80 %: každá dvojice u stolu se porovná podle rozdílu zbylých bodů.</li>
      <li>Kdo skončí těsně za vítězem, skoro nic neztratí. Kdo zůstane s plnou rukou, ztratí nejvíc.</li>
      <li>Zavření rozhoduje z 20 %, takže vítěz si vždycky něco připíše.</li>
      <li>Rozdíl 150 bodů a víc se počítá jako jasná prohra.</li>
      <li>Užší ranky: každý rank má 25 Elo (Silver od 1490, Gold od 1515, Platinum od 1540 …). Start 1500 = Silver.</li>
      <li>K-faktor zůstává 44.</li>
      <li>Sezóna 1 i minulá sezóna jsou přepočítané podle nových pravidel.</li></ul>
      <p class="muted">Proč: z téměř 70 her vyšlo, že o tom, kdo zavře, rozhoduje zatím hlavně náhoda – zbylé body lépe ukazují, kdo hraje dobře.</p></div>
      <div class="panel"><h2>Patch 1.0 · Start ligy</h2><ul>
      <li>Elo pro stoly 3–6 hráčů: každý se porovná s každým, kdo seděl u stejného stolu.</li>
      <li>Ranky Iron až Challenger podle League of Legends, start v Silveru (1500).</li>
      <li>Minulá sezóna je v archivu a do aktuálního Elo se nepočítá.</li></ul></div>`;
  },
  pravidla() {
    const s = D.settings;
    return `<div class="panel"><h2>Pravidla (patch 1.2.1)</h2><ul>
      <li>Každý hráč se porovná s každým, kdo seděl u stejného stolu.</li>
      <li>Body rozhodují z ${Math.round(100 * (1 - s.closeWeight))} %: rozdíl zbylých bodů ve dvojici, ${s.clearLoss}+ = jasná prohra.</li>
      <li>Zavření rozhoduje z ${Math.round(100 * s.closeWeight)} %.</li>
      <li>K-faktor ${s.k}, start ${s.start} Elo (Silver).</li>
      <li>Bodování karet: Joker 50, 2–9 hodnota, J–A 10. Vítěz = 0 bodů.</li></ul>
      <h2>Ranky</h2><table>${D.ranks.map(([r, f]) => `<tr><td><div class="player">${emblem(r)}${r}</div></td><td class="num">od ${f || "—"}</td></tr>`).join("")}</table></div>`;
  }
};

function chart(hist, players, w = 900, h = 320) {
  const vals = hist.flatMap(x => players.map(p => x.after[p])).concat(D.settings.start);
  const lo = Math.min(...vals) - 5, hi = Math.max(...vals) + 5, n = hist.length;
  const X = i => 30 + (w - 40) * i / n, Y = v => 10 + (h - 30) * (hi - v) / (hi - lo);
  const grid = D.ranks.filter(([, f]) => f > lo && f < hi).map(([r, f]) => `<line x1="30" x2="${w - 10}" y1="${Y(f)}" y2="${Y(f)}" stroke="${RANK_COLOR[r]}" stroke-dasharray="4 4" opacity=".5"/><text x="${w - 12}" y="${Y(f) - 3}" fill="${RANK_COLOR[r]}" font-size="11" text-anchor="end">${r}</text>`).join("");
  const lines = players.map((p, j) => {
    // hráč má bod jen po hrách, které hrál (a start)
    const pts = [[0, D.settings.start]]; hist.forEach((x, i) => { if (p in x.game) pts.push([i + 1, x.after[p]]); });
    return `<polyline fill="none" stroke="${LINE[j % LINE.length]}" stroke-width="2" points="${pts.map(([i, v]) => X(i) + "," + Y(v)).join(" ")}"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${grid}${lines}<text x="30" y="${h - 4}" fill="#7b7a6e" font-size="11">hra 0</text><text x="${w - 10}" y="${h - 4}" fill="#7b7a6e" font-size="11" text-anchor="end">hra ${n}</text></svg>
    <div class="legend">${players.map((p, j) => `<span style="--c:${LINE[j % LINE.length]}" data-p="${esc(p)}">${esc(p)}</span>`).join("")}</div>`;
}

function openProfile(p) {
  const s = S[cur.id].st[p], r = rank(s.elo), dlg = $("#profile");
  dlg.innerHTML = `<div class="player" style="cursor:auto">${emblem(r, "emb\" style=\"width:72px;height:72px")}<div><h2 style="margin:0">${esc(p)}</h2>${cur.fullNames?.[p] ? `<div class="muted">${esc(cur.fullNames[p])}</div>` : ""}<div class="rk">${r} · ${fmt(s.elo)} Elo</div></div></div>
    <div class="stats"><div><b>${s.games}</b>her</div><div><b>${s.wins}</b>výher</div><div><b>${s.games ? Math.round(100 * s.wins / s.games) : 0}%</b>winrate</div>
    <div><b>${s.games ? (s.pts / s.games).toFixed(1).replace(".", ",") : "—"}</b>Ø body</div><div><b>${fmt(s.max)}</b>max Elo</div><div><b>${fmt(s.min)}</b>min Elo</div></div>
    ${chart(S[cur.id].hist, [p], 500, 200)}<form method="dialog" style="text-align:right;margin-top:10px"><button>Zavřít</button></form>`;
  dlg.showModal();
}

document.addEventListener("submit", async e => {
  if (e.target.id !== "zf") return;
  e.preventDefault();
  const f = e.target, msg = $("#zmsg"), hra = {};
  const inputs = [...f.querySelectorAll("#sel input")];
  if (inputs.some(i => i.value === "")) return msg.textContent = "Doplň body všem vybraným hráčům.";
  inputs.forEach(i => hra[i.name] = +i.value);
  const nove = Object.keys(hra).filter(p => !D.seasons[0].players.includes(p)), novy = nove[0];
  if (nove.length > 1) return msg.textContent = "V jedné hře může být nejvýš 1 nový hráč.";
  const v = Object.values(hra);
  if (v.length < 2 || v.length > 6) return msg.textContent = "Vyber 2–6 hráčů.";
  if (v.some(x => !Number.isInteger(x) || x < 0 || x > 999)) return msg.textContent = "Body musí být celá čísla 0–999.";
  if (!v.includes(0)) return msg.textContent = "Někdo musí zavřít (0 bodů).";
  msg.textContent = "Ukládám…";
  try {
    const r = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ heslo: ZAPIS_HESLO, hra }) }).then(x => x.json());
    if (!r.ok) return msg.textContent = r.chyba || "Uložení selhalo.";
    // když tabulka ještě nestihla, přidej hru lokálně
    await reload(s => { s.games.push(hra); if (novy) s.players.push(novy); });
    autoPlay();
  } catch (err) { msg.textContent = "Nepodařilo se spojit s tabulkou: " + err.message; }
});

// --- zápis: bubliny hráčů ---
const bubble = p => `<label class="bub"><input type="checkbox" value="${esc(p)}"><span>${emblem(rank(S[D.seasons[0].id].st[p]?.elo ?? D.settings.start))}${esc(p)}</span></label>`;
function cards() {
  const vals = {};
  $("#sel").querySelectorAll("input").forEach(i => vals[i.name] = i.value);
  $("#sel").innerHTML = [...$("#bubs").querySelectorAll("input:checked")].map(c => `<div class="card"><b>${esc(c.value)}</b>
    <input type="number" min="0" max="999" step="1" inputmode="numeric" name="${esc(c.value)}" value="${esc(vals[c.value] ?? "")}" placeholder="body" aria-label="Body ${esc(c.value)}">
    <button type="button" class="win" data-win="${esc(c.value)}">🏆 zavřel</button></div>`).join("");
}
document.addEventListener("change", e => { if (e.target.closest("#bubs")) cards(); });
document.addEventListener("click", e => {
  if (e.target.id === "novy") {
    const p = (prompt("Jméno nového hráče:") || "").trim();
    if (!p) return;
    if (![...$("#bubs").querySelectorAll("input")].some(i => i.value === p)) e.target.insertAdjacentHTML("beforebegin", bubble(p));
    [...$("#bubs").querySelectorAll("input")].find(i => i.value === p).checked = true;
    cards();
  }
  const w = e.target.closest("[data-win]");
  if (w) $("#sel").querySelector(`input[name="${CSS.escape(w.dataset.win)}"]`).value = 0;
});

// --- admin: mazání her ---
const admin = () => store("zoliky-admin");
const post = body => fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(body) }).then(x => x.json());
async function reload(fallback) {
  const s = D.seasons[0];
  try { Object.assign(s, await live()); } catch { fallback(s); }
  S[s.id] = stats(s);
  cur = s; $("#season").value = s.id; tab = "hry"; render();
}
document.addEventListener("submit", async e => {
  if (e.target.id !== "af") return;
  e.preventDefault();
  $("#amsg").textContent = "Ověřuji…";
  const heslo = $("#aheslo").value;
  try {
    const r = await post({ akce: "overit", heslo });
    if (!r.admin) return $("#amsg").textContent = "Tohle není admin heslo.";
    store("zoliky-admin", heslo); render();
  } catch (err) { $("#amsg").textContent = "Nepodařilo se spojit s tabulkou: " + err.message; }
});
document.addEventListener("click", async e => {
  if (e.target.id === "odhlasit") { try { localStorage.removeItem("zoliky-admin"); } catch {} return render(); }
  const b = e.target.closest("[data-del]");
  if (!b) return;
  const i = +b.dataset.del;
  if (!confirm(`Opravdu smazat hru #${i + 1}? Další hry se posunou o jedno číslo dolů.`)) return;
  b.disabled = true;
  try {
    const r = await post({ akce: "smazat", heslo: admin(), cislo: i + 1 });
    if (!r.ok) { alert(r.chyba || "Smazání selhalo."); b.disabled = false; return; }
    await reload(s => s.games.splice(i, 1));
  } catch (err) { alert("Nepodařilo se spojit s tabulkou: " + err.message); b.disabled = false; }
});

// --- rank up / rank down animace ---
let queue = [], playing = false;
function rankChanges(h) { return Object.keys(h.game).filter(p => rank(h.before[p]) !== rank(h.after[p])).map(p => ({ p, from: rank(h.before[p]), to: rank(h.after[p]), elo: h.after[p] })); }
function playGame(i) { queue.push(...rankChanges(S[cur.id].hist[i])); next(); }
function next() {
  if (playing || !queue.length) return;
  playing = true;
  const c = queue.shift(), up = tier(c.to) > tier(c.from), fx = $("#fx");
  fx.className = "show " + (up ? "upfx" : "downfx");
  fx.style.setProperty("--rc", RANK_COLOR[c.to] + "88");
  fx.innerHTML = `<div><div class="stage"><div class="rays"></div>${emblem(c.from, "old")}${emblem(c.to, "new")}</div>
    <div class="title">${up ? "Povýšení" : "Sestup"}</div><div class="sub">${esc(c.p)} · ${c.from} → ${c.to} · ${fmt(c.elo)} Elo</div></div>`;
  const done = () => { fx.onclick = null; clearTimeout(t); fx.className = ""; playing = false; next(); };
  const t = setTimeout(done, 5000);
  fx.onclick = done;
}
// Při otevření přehraje změny ranků z her, které tenhle prohlížeč ještě neviděl.
function autoPlay() {
  const s = D.seasons[0], hist = S[s.id].hist, key = "zoliky-seen-" + s.id;
  const seen = store(key);
  const from = seen === null ? hist.length - 1 : +seen;
  hist.slice(Math.max(0, from)).forEach(h => queue.push(...rankChanges(h)));
  store(key, hist.length);
  next();
}

init();
</script>
</body>
